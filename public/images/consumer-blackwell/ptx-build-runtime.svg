<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title"><title id="title">PTX build and runtime path</title><rect width="960" height="350" fill="#f5f7fb" rx="16"/><style>text{font-family:Arial,sans-serif;fill:#17213a} .label{font-size:23px;font-weight:700} .sub{font-size:19px;fill:#40516b} .box{fill:white;stroke:#2337ff;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2337ff"/></marker></defs><text x="32" y="42" class="label">PTX source → build artifacts → GPU execution</text><rect class="box" x="30" y="75" width="180" height="92" rx="10"/><text class="label" x="120.0" y="111" text-anchor="middle">PTX source</text><text class="sub" x="120.0" y="142" text-anchor="middle">Authored kernels</text><path d="M212,121 L242,121" stroke="#2337ff" stroke-width="3" marker-end="url(#arrow)"/><rect class="box" x="250" y="75" width="180" height="92" rx="10"/><text class="label" x="340.0" y="111" text-anchor="middle">ptxas</text><text class="sub" x="340.0" y="142" text-anchor="middle">Build-time assembler</text><path d="M433,121 L463,121" stroke="#2337ff" stroke-width="3" marker-end="url(#arrow)"/><rect class="box" x="470" y="75" width="195" height="92" rx="10"/><text class="label" x="567.5" y="111" text-anchor="middle">cubin / SASS</text><text class="sub" x="567.5" y="142" text-anchor="middle">Compiled GPU code</text><path d="M668,121 L698,121" stroke="#2337ff" stroke-width="3" marker-end="url(#arrow)"/><rect class="box" x="705" y="75" width="225" height="92" rx="10"/><text class="label" x="817.5" y="111" text-anchor="middle">Rust binary</text><text class="sub" x="817.5" y="142" text-anchor="middle">Embedded kernels</text><text x="32" y="220" class="label">At runtime</text><rect class="box" x="235" y="190" width="245" height="92" rx="10"/><text class="label" x="357.5" y="226" text-anchor="middle">CUDA driver</text><text class="sub" x="357.5" y="257" text-anchor="middle">Load and launch</text><path d="M485,236 L535,236" stroke="#2337ff" stroke-width="3" marker-end="url(#arrow)"/><rect class="box" x="545" y="190" width="235" height="92" rx="10"/><text class="label" x="662.5" y="226" text-anchor="middle">GPU execution</text><text class="sub" x="662.5" y="257" text-anchor="middle">Runs SASS</text><text x="32" y="320" class="sub">Recreated from the published caption. No runtime CUDA toolkit or JIT in this path.</text></svg>
