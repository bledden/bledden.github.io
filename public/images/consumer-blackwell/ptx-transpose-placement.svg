<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img" aria-labelledby="title"><title id="title">Where V is transposed in V12a versus V12c</title><rect width="960" height="435" fill="#f5f7fb" rx="16"/><style>text{font-family:Arial,sans-serif;fill:#17213a} .label{font-size:23px;font-weight:700} .sub{font-size:19px;fill:#40516b} .box{fill:white;stroke:#2337ff;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2337ff"/></marker></defs><text x="32" y="42" class="label">Same attention math; the transpose moves</text><text x="32" y="85" class="sub">V12a · transpose inside the kernel, once per KV block</text><rect class="box" x="32" y="102" width="240" height="92" rx="10"/><text class="label" x="152.0" y="138" text-anchor="middle">Load V</text><text class="sub" x="152.0" y="169" text-anchor="middle">Original layout</text><path d="M278,148 L330,148" stroke="#2337ff" stroke-width="3" marker-end="url(#arrow)"/><rect class="box" x="340" y="102" width="260" height="92" rx="10"/><text class="label" x="470.0" y="138" text-anchor="middle">Transpose</text><text class="sub" x="470.0" y="169" text-anchor="middle">Shared memory</text><path d="M605,148 L655,148" stroke="#2337ff" stroke-width="3" marker-end="url(#arrow)"/><rect class="box" x="665" y="102" width="260" height="92" rx="10"/><text class="label" x="795.0" y="138" text-anchor="middle">MMA</text><text class="sub" x="795.0" y="169" text-anchor="middle">Consume operands</text><text x="32" y="247" class="sub">V12c · separate boundary relayout, then attention reads Vᵀ</text><rect class="box" x="32" y="266" width="240" height="92" rx="10"/><text class="label" x="152.0" y="302" text-anchor="middle">Relayout V → Vᵀ</text><text class="sub" x="152.0" y="333" text-anchor="middle">One read + one write</text><path d="M278,312 L330,312" stroke="#2337ff" stroke-width="3" marker-end="url(#arrow)"/><rect class="box" x="340" y="266" width="260" height="92" rx="10"/><text class="label" x="470.0" y="302" text-anchor="middle">Global Vᵀ buffer</text><text class="sub" x="470.0" y="333" text-anchor="middle">Pre-transposed</text><path d="M605,312 L655,312" stroke="#2337ff" stroke-width="3" marker-end="url(#arrow)"/><rect class="box" x="665" y="266" width="260" height="92" rx="10"/><text class="label" x="795.0" y="302" text-anchor="middle">Attention / MMA</text><text class="sub" x="795.0" y="333" text-anchor="middle">108 TFLOPS headline</text><text x="32" y="406" class="sub">Recreated schematic. Boundary relayout is additive; the headline kernel timing excludes it.</text></svg>
